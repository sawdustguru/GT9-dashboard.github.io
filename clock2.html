<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Web Clocks</title>
  <style>
    /* Base setup to fill and center on any device screen */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #9E9C9B;
      box-sizing: border-box;
      padding: 2vw;
    }

    /* Flex wrapper that handles the responsive layout */
    .dashboard {
      display: flex;
      gap: 4vw; /* Scales spacing based on window width */
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px; /* Prevents them from getting ridiculously massive on ultra-wide screens */
    }

    /* Shared style rules with dynamic borders and shadows */
    .clock-container {
      background-color: black;
      border: 0.4vw solid white; /* Border scales with window size */
      box-shadow: 0px 0px 1.5vw 0.5vw rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* Responsive Digital Clock Box */
    .digital-box {
      border-radius: 1vw;
      padding: 3vw 4vw;
      flex: 2; /* Gives the digital box a proportional priority */
      min-width: 0; 
    }

    /* Font uses fluid viewport sizes */
    .clock {
      font-family: 'arial', Courier, monospace;
      font-size: calc(3vw + 2rem); /* Dynamic baseline sizing */
      text-align: center;
      color: white;
      white-space: nowrap;
    }

    /* Responsive Analog Clock Box */
    .analog-box {
      border-radius: 50%;
      flex: 1; /* Scales layout dynamically */
      aspect-ratio: 1 / 1; /* Forces the box to remain a perfect circle */
      max-width: 300px; /* Standard upper constraint */
      min-width: 120px; /* Prevents it from breaking on tiny screens */
      width: 100%;
      position: relative;
    }

    /* Dynamic Center Pin */
    .analog-box::after {
      content: '';
      position: absolute;
      width: 4%; /* Percentage based so it grows with the clock face */
      height: 4%;
      background: white;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 10;
    }

    /* Percentage-based Analog Hands */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      background-color: white;
      border-radius: 0.2vw;
    }

    .hour {
      width: 2.5%;
      height: 25%; /* Reaches 25% towards the edge from the center */
    }

    .minute {
      width: 1.5%;
      height: 38%; /* Reaches 38% towards the edge */
    }

    .second {
      width: 0.8%;
      height: 43%; /* Reaches 43% towards the edge */
      background-color: #ff3b30;
    }

    /* Mobile handling: Stack them vertically if the screen gets too narrow */
    @media (max-width: 600px) {
      .dashboard {
        flex-direction: column;
        gap: 6vw;
      }
      .digital-box {
        width: 100%;
      }
      .analog-box {
        width: 50%; /* Sizes appropriately on mobile views */
      }
      .clock {
        font-size: 12vw;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Original Digital Display -->
    <div class="clock-container digital-box">
      <div class="clock">
        <div id="time">00:00:00</div>
      </div>
    </div>

    <!-- Matching Analog Display -->
    <div class="clock-container analog-box">
      <div class="hand hour" id="hour-hand"></div>
      <div class="hand minute" id="min-hand"></div>
      <div class="hand second" id="sec-hand"></div>
    </div>
  </div>

  <script>
    const hourHand = document.getElementById('hour-hand');
    const minHand = document.getElementById('min-hand');
    const secHand = document.getElementById('sec-hand');

    function updateClocks() {
      const now = new Date();

      // 1. Digital update logic
      const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      document.getElementById('time').textContent = timeString;

      // 2. Analog rotation calculation
      const seconds = now.getSeconds();
      const secondsDegrees = seconds * 6; 

      const minutes = now.getMinutes();
      const minutesDegrees = (minutes * 6) + (seconds * 0.1); 

      const hours = now.getHours();
      const hoursDegrees = ((hours % 12) * 30) + (minutes * 0.5);

      secHand.style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
      minHand.style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
