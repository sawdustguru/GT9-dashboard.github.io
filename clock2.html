<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown & Analog Clock with Numbers</title>
  <style>
    /* Centers the clock system relative to the browser frame */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #9E9C9B;
      box-sizing: border-box;
      padding: 2vw;
    }

    /* Container holding both panels side-by-side */
    .dashboard {
      display: flex;
      gap: 4vw; /* Scalable gap between components */
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1400px;
    }

    /* Shared style guidelines mapped from your original design */
    .clock-container {
      background-color: black;
      border: 0.4vw solid white; /* Fluid border thickness */
      box-shadow: 0px 0px 1.5vw 0.5vw rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* Fluid Countdown Panel */
    .digital-box {
      border-radius: 1vw;
      padding: 3vw 4vw;
      flex: 2; /* Takes proportional priority layout */
      min-width: 0;
    }

    /* Keeps your font styling but gives it liquid scalability */
    .clock {
      font-family: 'arial', Courier, monospace;
      font-size: calc(3vw + 2.5rem); /* Dynamic scale based on viewpoint */
      text-align: center;
      color: white;
      white-space: nowrap;
    }

    /* Fluid Matching Analog Panel */
    .analog-box {
      border-radius: 50%; /* Circle profile */
      flex: 1;
      aspect-ratio: 1 / 1; /* Retains circle layout when width/height alter */
      max-width: 320px;
      min-width: 180px; /* Increased slightly to protect layout room for numbers */
      width: 100%;
      position: relative;
    }

    /* Dial Numbers Structure */
    .number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      color: white;
      font-family: 'arial', sans-serif;
      font-weight: bold;
      font-size: calc(1vw + 0.6rem); /* Scalable number text */
      padding: 4%; /* Inset from the outer border rim */
      box-sizing: border-box;
      /* Rotate container element to index point, rotate number backwards to keep text upright */
      transform: rotate(calc(var(--rotation) * 1deg));
    }
    .number span {
      display: inline-block;
      transform: rotate(calc(var(--rotation) * -1deg));
    }

    /* Center connection node */
    .analog-box::after {
      content: '';
      position: absolute;
      width: 4%;
      height: 4%;
      background: white;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 10;
    }

    /* Scalable hand vectors */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      background-color: white;
      border-radius: 0.2vw;
      z-index: 5;
    }

    .hour {
      width: 2.5%;
      height: 24%;
    }

    .minute {
      width: 1.5%;
      height: 35%;
    }

    .second {
      width: 0.8%;
      height: 40%;
      background-color: #ff3b30;
    }

    /* Responsive fall-back for mobile dimensions */
    @media (max-width: 700px) {
      .dashboard {
        flex-direction: column;
        gap: 6vw;
      }
      .digital-box {
        width: 100%;
      }
      .analog-box {
        width: 55%;
      }
      .clock {
        font-size: 11vw;
      }
      .number {
        font-size: calc(2vw + 0.5rem);
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Your Digital Countdown Module -->
    <div class="clock-container digital-box">
      <div class="clock">
        <div id="countdown"></div>
      </div>
    </div>

    <!-- Companion Analog Regular Time Module -->
    <div class="clock-container analog-box">
      <!-- Face Numbers (30 degree step increments) -->
      <div class="number" style="--rotation: 30;"><span>1</span></div>
      <div class="number" style="--rotation: 60;"><span>2</span></div>
      <div class="number" style="--rotation: 90;"><span>3</span></div>
      <div class="number" style="--rotation: 120;"><span>4</span></div>
      <div class="number" style="--rotation: 150;"><span>5</span></div>
      <div class="number" style="--rotation: 180;"><span>6</span></div>
      <div class="number" style="--rotation: 210;"><span>7</span></div>
      <div class="number" style="--rotation: 240;"><span>8</span></div>
      <div class="number" style="--rotation: 270;"><span>9</span></div>
      <div class="number" style="--rotation: 300;"><span>10</span></div>
      <div class="number" style="--rotation: 330;"><span>11</span></div>
      <div class="number" style="--rotation: 360;"><span>12</span></div>

      <!-- Moving Hands -->
      <div class="hand hour" id="hour-hand"></div>
      <div class="hand minute" id="min-hand"></div>
      <div class="hand second" id="sec-hand"></div>
    </div>
  </div>

  <script>
    const hourHand = document.getElementById('hour-hand');
    const minHand = document.getElementById('min-hand');
    const secHand = document.getElementById('sec-hand');

    function updateDashboard() {
      const now = new Date();

      // --- 1. RUN YOUR COUNTDOWN LOGIC ---
      let endTime = new Date();
      endTime.setHours(18, 0, 0, 0); // 6:00 PM

      if (now > endTime) {
        endTime.setDate(endTime.getDate() + 1);
        endTime.setHours(17, 30, 0, 0);
      }

      const remainingTime = endTime - now;
      let hours = Math.floor((remainingTime / (1000 * 60 * 60)) % 24);
      let minutes = Math.floor((remainingTime / 1000 / 60) % 60);
      let seconds = Math.floor((remainingTime / 1000) % 60);

      hours = hours < 10 ? '0' + hours : hours;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      seconds = seconds < 10 ? '0' + seconds : seconds;

      document.getElementById('countdown').textContent = `${hours}:${minutes}:${seconds}`;

      // --- 2. RUN MATCHING ANALOG LOGIC (Current Local Time) ---
      const currentSec = now.getSeconds();
      const secDegrees = currentSec * 6;

      const currentMin = now.getMinutes();
      const minDegrees = (currentMin * 6) + (currentSec * 0.1);

      const currentHour = now.getHours();
      const hourDegrees = ((currentHour % 12) * 30) + (currentMin * 0.5);

      secHand.style.transform = `translateX(-50%) rotate(${secDegrees}deg)`;
      minHand.style.transform = `translateX(-50%) rotate(${minDegrees}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourDegrees}deg)`;
    }

    // Initialize layout immediately
    updateDashboard();
    setInterval(updateDashboard, 1000);
  </script>
</body>
</html>
